spring:
  datasource:
    url: jdbc:h2:file:./src/data/testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  web:
    cors:
      allowed-origins:
        - "http://localhost:8710"
        - "http://localhost:5173"
        - "http://192.168.178.253:8710"
        - "http://192.168.178.253:5173"
        - "http://msi:8710"
        - "http://msi:5173"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true