spring:
  datasource:
    url: jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: postgres.${supabase.project}
    password: ${supabase.password}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: app_todo
    hibernate:
      ddl-auto: validate
    show-sql: false
    hikari:
      max-lifetime: 180000   # 3 Minuten
      idle-timeout: 120000   # 2 Minuten
      minimum-idle: 1
      maximum-pool-size: 5
